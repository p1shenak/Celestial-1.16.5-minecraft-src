        def sourceJar = file('libs/celestial-client-remapped.jar.bak')
        if (!sourceJar.exists()) {
            sourceJar = file('libs/celestial-client-remapped.jar')
        }
        def targetJar = file('libs/celestial-client-remapped.jar')
        def tempJar = file('libs/celestial-client-remapped.tmp')

        def urls = configurations.remapWorker.files.collect { it.toURI().toURL() } as URL[]
        def cl = new URLClassLoader(urls, ClassLoader.systemClassLoader)

        def classReaderClass = cl.loadClass('org.objectweb.asm.ClassReader')
        def classWriterClass = cl.loadClass('org.objectweb.asm.ClassWriter')
        def classRemapperClass = cl.loadClass('org.objectweb.asm.commons.ClassRemapper')
        def simpleRemapperClass = cl.loadClass('org.objectweb.asm.commons.SimpleRemapper')

        def remapperInstance = simpleRemapperClass.getConstructor(Map.class).newInstance(mappings)

        println "[Remapper] Remapping ${sourceJar.name} -> ${targetJar.name}..."

        def zipIn = new java.util.zip.ZipFile(sourceJar)
        def zipOut = new java.util.zip.ZipOutputStream(new FileOutputStream(tempJar))

        def entries = zipIn.entries()
        while (entries.hasMoreElements()) {
            def entry = entries.nextElement()
            def name = entry.name
            def is = zipIn.getInputStream(entry)
            def bytes = is.readAllBytes()
            is.close()

            if (name.endsWith('.class')) {
                try {
                    def cr = classReaderClass.getConstructor(byte[].class).newInstance([bytes] as Object[])
                    def cw = classWriterClass.getConstructor(int.class).newInstance([0] as Object[])
                    def remapper = classRemapperClass.getConstructor(cl.loadClass('org.objectweb.asm.ClassVisitor'), cl.loadClass('org.objectweb.asm.commons.Remapper')).newInstance([cw, remapperInstance] as Object[])
                    def acceptMethod = classReaderClass.getMethod('accept', cl.loadClass('org.objectweb.asm.ClassVisitor'), int.class)
                    acceptMethod.invoke(cr, [remapper, 0] as Object[])
                    bytes = cw.toByteArray()

                    def entryClassName = name.substring(0, name.length() - 6)
                    if (mappings.containsKey(entryClassName)) {
                        name = mappings[entryClassName] + '.class'
                    }
                } catch (Exception e) {
                    println "Warning remapping ${name}: ${e.message}"
                }
            }

            def newEntry = new java.util.zip.ZipEntry(name)
            zipOut.putNextEntry(newEntry)
            zipOut.write(bytes)
            zipOut.closeEntry()
        }

        zipIn.close()
        zipOut.close()

        if (targetJar.exists()) targetJar.delete()
        tempJar.renameTo(targetJar)

        println "[Remapper] Done! Successfully remapped jar."
    }
}


application {
    mainClass = 'offline.launcher.OfflineLauncher'
}

def configureClientExec(JavaExec task) {
    def targetGameDir = file('run')
    if (!targetGameDir.exists()) targetGameDir.mkdirs()
    def defaultMcAssets = file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/assets")
    def runAssets = file('run/assets')
    // A folder only counts as "real" assets if it actually has the asset index file
    // (indexes/1.16.json) that vanilla sound/lang loading depends on -- just existing
    // as an empty/partial directory (common with other launchers) is not enough.
    def hasRealAssets = { File dir -> file("${dir}/indexes/1.16.json").exists() }
    def targetAssetsDir = hasRealAssets(runAssets) ? runAssets
        : (hasRealAssets(defaultMcAssets) ? defaultMcAssets : runAssets)

    println "[Celestial] Using assets dir: ${targetAssetsDir.absolutePath} (has index: ${hasRealAssets(targetAssetsDir)})"

    task.javaLauncher = javaToolchains.launcherFor(java.toolchain)
    task.classpath = sourceSets.main.runtimeClasspath
    task.mainClass = 'offline.launcher.OfflineLauncher'
    task.workingDir = targetGameDir
    
    task.jvmArgs = [
        "-Xms512m",
        "-Xmx4g",
        "-Djava.library.path=${file('natives').absolutePath}",
        "-Djna.library.path=${file('natives').absolutePath}",
        "-Dorg.lwjgl.librarypath=${file('natives').absolutePath}",
        "-Djna.tmpdir=${file('natives').absolutePath}",
        "-Dsun.net.client.defaultConnectTimeout=1500",
        "-Dsun.net.client.defaultReadTimeout=1500",
        "-Dlog4j2.formatMsgNoLookups=true",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/java.nio=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED",
        "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
        "--add-opens=jdk.unsupported/sun.misc=ALL-UNNAMED",
        "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"
    ]
    
    task.args = [
        '--username', 'Player',
        '--version', 'Beta 1.16.5',
        '--gameDir', targetGameDir.absolutePath,
        '--assetsDir', targetAssetsDir.absolutePath,
        '--assetIndex', '1.16',
        '--uuid', 'bd346dd5-ac1c-427d-87e8-73bdd4bf3e13',
        '--accessToken', '0',
        '--userType', 'legacy',
        '--versionType', 'release',
        '--userProperties', '{}',
        '--width', '1280',
        '--height', '720'
    ]
}

tasks.named('run', JavaExec) {
    group = 'execution'
    description = 'Runs the Celestial Client'
    configureClientExec(it)
}

tasks.register('runClient', JavaExec) {
    group = 'execution'
    description = 'Runs the Celestial Client'
    configureClientExec(it)
}
